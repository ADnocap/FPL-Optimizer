[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-optimizer"
version = "0.1.0"
description = "LightGBM point prediction + MILP squad optimisation for Fantasy Premier League"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.31",
    "tzdata; sys_platform == 'win32'",  # zoneinfo on Windows (FPL lockdown times)
]

[project.optional-dependencies]
prediction = [
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "unidecode>=1.3",
]
optimizer = [
    "pulp>=2.7",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "pulp>=2.7",
    "unidecode>=1.3",
]
data = [
    "aiohttp>=3.9",
    "understatapi>=0.7",
    "soccerdata>=1.8",
    "pyarrow>=14.0",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "bug(id): regression test for a rules bug found by the 2026-09-24 audit (fixed)",
]
